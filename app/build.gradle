plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    buildFeatures{
        dataBinding true
        buildConfig true
    }

    compileSdk 36

    defaultConfig {
        applicationId "com.braineer.nuresult"
        minSdk 21
        targetSdk 36
        versionCode 15
        versionName "5.7.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            // Google's official test ad units, so testing never serves or clicks real ads
            resValue "string", "app_id", "ca-app-pub-3940256099942544~3347511713"
            resValue "string", "banner_ad_unit_id", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "interstitial_ad_unit_id", "ca-app-pub-3940256099942544/1033173712"
        }
        release {
            resValue "string", "app_id", "ca-app-pub-1276360114688784~3736839849"
            resValue "string", "banner_ad_unit_id", "ca-app-pub-1276360114688784/9861881603"
            resValue "string", "interstitial_ad_unit_id", "ca-app-pub-1276360114688784/9308870346"
            // R8: shrink, optimize and obfuscate (Play's DEX optimization check)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // Release's R8 setup with test ads, for checking the shrunk app on a device
        minifiedDebug {
            initWith debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['debug']
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    namespace 'com.braineer.nuresult'
}
kotlin {
    jvmToolchain(17)
}


dependencies {
    // Use matching BOM version
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.1.0"))

    // Google Mobile Ads (GMA) & UMP SDK
    implementation 'com.google.android.gms:play-services-ads:23.6.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.1.0'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.6.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.6.0'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (android.jar only ships stubs)
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
